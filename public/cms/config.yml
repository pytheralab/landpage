# Cấu hình Sveltia CMS cho www.pythera.ai — sinh tự động, sửa trong build_cms_config.py nếu đổi cấu trúc.
# Đăng nhập: dùng "Sign In Using Access Token" (token GitHub chỉ cấp quyền repo landpage). Muốn bật "Sign In with GitHub" thì dựng Worker xác thực rồi thêm base_url vào backend.
backend:
  name: "github"
  repo: "pytheralab/landpage"
  branch: "main"
media_folder: "public/media/uploads"
public_folder: "/media/uploads"
i18n:
  structure: "multiple_files"
  locales:
    - "vi"
    - "en"
    - "ja"
  default_locale: "vi"
collections:
  - name: "pages"
    label: "Trang"
    i18n: true
    files:
      - name: "home"
        label: "Trang chủ"
        file: "src/content/home.{{locale}}.json"
        i18n: true
        fields:
          - name: "sections"
            label: "Các section"
            label_singular: "Section"
            widget: "list"
            i18n: true
            hint: "Kéo để đổi thứ tự, bấm Thêm để chèn section mới."
            types:
              - name: "hero"
                label: "Hero (đầu trang)"
                summary: "Hero"
                fields:
                  - name: "enabled"
                    label: "Hiển thị section"
                    widget: "boolean"
                    default: true
                    i18n: "duplicate"
                    required: false
                  - name: "background"
                    label: "Nền section"
                    widget: "select"
                    options:
                      - label: "Mặc định"
                        value: "default"
                      - label: "Dải nền tràn ngang"
                        value: "alt"
                    i18n: "duplicate"
                    default: "default"
                  - name: "audience_label"
                    label: "Nhãn chọn loại đơn vị"
                    widget: "string"
                    i18n: true
                    required: true
                  - name: "audience_aria"
                    label: "Mô tả cho trình đọc màn hình"
                    widget: "string"
                    i18n: true
                    required: true
                  - name: "audiences"
                    label: "Loại đơn vị"
                    widget: "list"
                    i18n: true
                    fields:
                      - name: "key"
                        label: "Mã"
                        widget: "string"
                        i18n: "duplicate"
                        required: true
                        hint: "Ví dụ dn, bv, nm"
                      - name: "label"
                        label: "Tên nút"
                        widget: "string"
                        i18n: true
                        required: true
                      - name: "title"
                        label: "Tiêu đề lớn"
                        widget: "text"
                        i18n: true
                        required: true
                      - name: "lead"
